spring.application.name=auth4

# === DATABASE HSQLDB (in-memory) ===
spring.datasource.url=jdbc:hsqldb:file:./hsql-db/auth4/db
spring.datasource.username=SA
spring.datasource.password=
spring.datasource.show-sql=true

# === JPA ===
spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# === JWT Config ===
# Chiave generata con: openssl rand -base64 32  (deve essere >= 32 byte per HS256)
# In produzione: SOLO via env var, MAI committata.
# Default fallback solo per sviluppo locale (dopo i ":" nella property).
jwt.secret=${JWT_SECRET:MySuperSecureKeyThatIsAtLeast32Chars!!}
# 1h in ms
jwt.expiration=3600000
# 24h in ms
jwt.refresh.expiration=86400000

# === Debug / Dev ===
spring.main.allow-bean-definition-overriding=true
# In dev: 'always' aiuta. In prod cambiare a 'never' per non leakare stack/messaggi.
server.error.include-message=never

# === HTTPS ===
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:uniea.p12
# Password keystore via env var; fallback solo per dev locale.
server.ssl.key-store-password=${KEYSTORE_PASSWORD:password}
server.ssl.keyStoreType=PKCS12
server.ssl.keyAlias=uniea
server.ssl.key-password=${KEY_PASSWORD:password}

# SSL protocol to use
server.ssl.protocol=TLS
# Enabled SSL protocols
server.ssl.enabled-protocols=TLSv1.2

# === CORS ===
# elenco separato da virgole
cors.allowed-origins=https://app.example.com,http://localhost:4200